name: text2scene3d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1
  - numpy>=1.24.0,<2.0.0
  - scipy>=1.11.0
  - pip:
      - diffusers>=0.30.0
      - transformers>=4.44.0
      - accelerate>=0.28.0
      - sentencepiece>=0.2.0
      - protobuf>=4.25.0
      - git+https://github.com/facebookresearch/segment-anything.git
      - opencv-python>=4.8.0
      - pillow>=10.2.0
      - trimesh>=4.0.0
      - open3d>=0.18.0
      - matplotlib>=3.8.0
      - tqdm>=4.66.0
      - pydantic>=2.5.0

